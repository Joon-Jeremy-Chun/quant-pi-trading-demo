<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Little Quant Lab</title><desc id="desc">A student software lab with synthetic inputs and a local dashboard.</desc><rect width="1200" height="340" rx="22" fill="#173d3e"/><g fill="#ffffff" opacity=".05"><rect x="865" y="60" width="115" height="95" rx="16"/><rect x="1000" y="60" width="115" height="95" rx="16"/><rect x="865" y="175" width="115" height="95" rx="16"/><rect x="1000" y="175" width="115" height="95" rx="16"/></g><text x="60" y="63" fill="#a5e0bc" font-family="Segoe UI,Arial" font-size="16" letter-spacing="4">A SOFTWARE LAB FOR STUDENTS</text><text x="56" y="145" fill="white" font-family="Segoe UI,Arial" font-size="64" font-weight="700">Little Quant Lab</text><text x="60" y="194" fill="#d4e8e0" font-family="Segoe UI,Arial" font-size="23">Read the data. Trace the code. Explain the result.</text><rect x="60" y="244" width="685" height="49" rx="9" fill="#ffffff" opacity=".08"/><text x="82" y="276" fill="#effaf3" font-family="Segoe UI,Arial" font-size="17">SYNTHETIC DATA   /   LOCAL EXERCISES   /   3D + 2D DASHBOARD</text></svg>
